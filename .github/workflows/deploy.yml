# Builds the game and publishes it to GitHub Pages.
# Runs on every push, every 6 hours (to refresh real NASA data), or by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Real NASA data: DONKI flares/CMEs/storms + OSDR studies -> src/data/nasaSnapshot.json
      # Optional: add a free key from https://api.nasa.gov as repo secret NASA_API_KEY (DEMO_KEY is rate limited).
      - run: npm run fetch-data
        env:
          VITE_NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
